<div
    class="photo-zoom-backdrop">

    <button
        type="button"
        class="photo-zoom-close"
        aria-label="Close"
        (click)="close.emit()">
        &times;
    </button>

    <img
        [src]="photoUrl()"
        [alt]="alt()"
        class="photo-zoom-image"
        (click)="$event.stopPropagation()">

</div>
