<div class="card border-0 shadow-sm h-100 overflow-hidden bg-white rounded-0 transition-all">

    <!-- Górna sekcja / Zdjęcie lub akcent wizualny (opcjonalnie możesz tu wrzucić miniaturkę zegarka) -->
    <div class="position-relative bg-light p-4 text-center border-bottom border-light overflow-hidden">

        @if (watchPhoto()) {
        <div class="watch-img-container mb-3 position-relative overflow-hidden" style="height: 180px;">
            <img [src]="watchPhoto()!.photoUrl" [alt]="watchPhoto()!.description || watch().model"
                class="w-100 h-100 object-fit-contain">
        </div>
        } @else {
        <div class="watch-img-container mb-3 d-flex align-items-center justify-content-center bg-light border border-light text-muted small text-uppercase"
            style="height: 180px; letter-spacing: 1px;">
            Brak zdjęcia
        </div>
        }


        <!-- Oddział -->
        <span class="badge text-uppercase tracking-widest px-2 py-1 bg-dark text-white fw-normal rounded-0"
            style="font-size: 0.65rem; letter-spacing: 1px;">
            {{ watch().branchName }}
        </span>

        <div class="my-2">
            <span class="text-uppercase tracking-wider small fw-semibold d-block"
                style="font-size: 0.7rem; color: #bfa130; letter-spacing: 1.5px;">
                {{ watch().manufacturer }}
            </span>
            <h3 class="h6 fw-bold text-dark mb-0 font-serif">
                {{ watch().model }}
            </h3>
        </div>

        <!-- Status -->
        <span
            class="position-absolute top-0 end-0 m-3 badge rounded-0 bg-white text-dark fw-light border border-light shadow-sm"
            style="font-size: 0.65rem; letter-spacing: 1px;">
            {{ statusLabels[watch().status] }}
        </span>
    </div>

    <!-- Główna zawartość karty -->
    <div class="card-body d-flex flex-column justify-content-between p-4">

        <div class="text-center mb-4">
            <div class="text-secondary small text-uppercase mb-1" style="font-size: 0.65rem; letter-spacing: 1px;">Cena
                wynajmu</div>
            <div class="fs-4 fw-bold text-dark">
                {{ watch().pricePerDay }} <span class="fs-6 fw-normal text-muted">zł / dzień</span>
            </div>
        </div>

        <!-- Przycisk akcji w minimalistycznym, eleganckim stylu -->
        <button type="button" class="btn w-100 text-uppercase fw-semibold py-2 text-white transition-all rounded-0"
            style="background-color: #1a1a1a; letter-spacing: 0.15em; font-size: 0.75rem;"
            (click)="openFullInfoModal()">
            Sprawdź pełne informacje
        </button>

    </div>
</div>

<!-- Modal / Widok szczegółowy -->
@if (showFullInfoModal()) {
<app-watch-full-info-view [watch]="watch()" (close)="closeFullInfoModal()" (watchUpdated)="onWatchUpdated()" [editWatchPhotos] = "editWatchPhotos()">
</app-watch-full-info-view>
}
