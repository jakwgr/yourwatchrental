<div class="calendar bg-white border border-dark shadow-sm p-3 p-md-4 w-100">

  <div class="calendar-header d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">

    <button
      type="button"
      class="btn btn-outline-dark rounded-0 shadow-none d-flex align-items-center justify-content-center"
      style="width: 36px; height: 36px;"
      (click)="monthBefore()">
      ←
    </button>

    <div class="text-center">
      <div
        class="text-uppercase text-secondary fw-semibold mb-1"
        style="font-size: 0.65rem; letter-spacing: 2px;">
        Watch Availability
      </div>

      <h2 class="h5 text-dark fw-semibold text-capitalize mb-0">
        {{ currentDate().toLocaleString('en-US', { month: 'long', year: 'numeric' }) }}
      </h2>
    </div>

    <button
      type="button"
      class="btn btn-outline-dark rounded-0 shadow-none d-flex align-items-center justify-content-center"
      style="width: 36px; height: 36px;"
      (click)="monthAfter()">
      →
    </button>

  </div>
  <div
    class="weekdays text-secondary text-uppercase fw-semibold text-center mb-2"
    style="
      font-size: 0.68rem;
      letter-spacing: 1px;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    ">

    <div>Mon</div>
    <div>Tue</div>
    <div>Wed</div>
    <div>Thu</div>
    <div>Fri</div>
    <div>Sat</div>
    <div>Sun</div>

  </div>

  <div
    class="days"
    style="
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    ">

    @for (day of days; track $index) {

      <div
        class="calendar-day d-flex align-items-center justify-content-center"
        style="
          min-height: 42px;
          font-size: 0.85rem;
          font-weight: 500;
          cursor: pointer;
          transition: all 0.15s ease;
        "

        (click)="datePickerClick(day)"

        [class.available-day]="
          selectedDateEnd() === null &&
          isDayInAllowedRange(day)
        "

        [class.rented]="isRented(day)"
        [class.past-day]="isPastDay(day)"
        [class.selected-day]="isDaySelected(day)">

        {{ day }}

      </div>

    }

  </div>

  @if (isDatePicker()) {

    <div class="mt-4 pt-3 border-top">

      <button
        type="button"
        class="btn btn-outline-secondary rounded-0 shadow-none w-100 text-uppercase fw-semibold py-2"
        style="
          font-size: 0.65rem;
          letter-spacing: 1.5px;
        "
        (click)="datePickerReset()">

        Clear Selection

      </button>

    </div>

  }

  <div class="mt-4 pt-3 border-top">

    <div
      class="text-uppercase text-secondary fw-semibold mb-3 text-center"
      style="font-size: 0.62rem; letter-spacing: 1.5px;">
      Legend
    </div>

    <div class="d-flex flex-wrap justify-content-center gap-3 gap-md-4">

      @if (isDatePicker()) {

        <div class="d-flex align-items-center gap-2">
          <span
            class="d-inline-block border border-secondary"
            style="
              width: 12px;
              height: 12px;
              background-color: #ffffff;
            ">
          </span>

          <span
            class="text-secondary fw-medium"
            style="font-size: 0.68rem;">
            Available
          </span>
        </div>


        <div class="d-flex align-items-center gap-2">
          <span
            class="d-inline-block"
            style="
              width: 12px;
              height: 12px;
              background-color: #fff3cd;
              border: 1px solid #d6b656;
            ">
          </span>

          <span
            class="text-secondary fw-medium"
            style="font-size: 0.68rem;">
            Selectable
          </span>
        </div>

        <div class="d-flex align-items-center gap-2">
          <span
            class="d-inline-block"
            style="
              width: 12px;
              height: 12px;
              background-color: #198754;
            ">
          </span>

          <span
            class="text-secondary fw-medium"
            style="font-size: 0.68rem;">
            Selected
          </span>
        </div>

      }

      <div class="d-flex align-items-center gap-2">
        <span
          class="d-inline-block"
          style="
            width: 12px;
            height: 12px;
            background-color: #dc3545;
          ">
        </span>

        <span
          class="text-secondary fw-medium"
          style="font-size: 0.68rem;">
          Rented
        </span>
      </div>

      <div class="d-flex align-items-center gap-2">
        <span
          class="d-inline-block"
          style="
            width: 12px;
            height: 12px;
            background-color: #adb5bd;
          ">
        </span>

        <span
          class="text-secondary fw-medium"
          style="font-size: 0.68rem;">
          Past
        </span>
      </div>

    </div>

  </div>

</div>
