<div class="calendar p-2 p-md-3 bg-white border border-light shadow-sm w-100">

  <!-- Nagłówek kalendarza -->
  <div class="calendar-header d-flex justify-content-between align-items-center mb-2 mb-md-3 pb-2 border-bottom">
    <button type="button" class="btn btn-outline-dark btn-sm rounded-0 px-2 py-0 shadow-none"
      (click)="monthBefore()">←</button>

    <h2 class="h6 text-uppercase text-dark fw-light mb-0" style="letter-spacing: 1px; font-size: 0.8rem;">
      {{ currentDate().toLocaleString('pl-PL', { month: 'long', year: 'numeric' }) }}
    </h2>

    <button type="button" class="btn btn-outline-dark btn-sm rounded-0 px-2 py-0 shadow-none"
      (click)="monthAfter()">→</button>
  </div>

  <!-- Dni tygodnia -->
  <div class="weekdays text-secondary text-uppercase fw-medium text-center mb-1"
    style="font-size: 0.55rem; letter-spacing: 0.5px; display: grid; grid-template-columns: repeat(7, 1fr);">
    <div>Pn</div>
    <div>Wt</div>
    <div>Śr</div>
    <div>Cz</div>
    <div>Pt</div>
    <div>Sb</div>
    <div>Nd</div>
  </div>

  <!-- Siatka dni (bez przerw/borderów między nimi) -->
  <div class="days text-center" style="display: grid; grid-template-columns: repeat(7, 1fr);">
    @for (day of days; track $index) {
    <div class="py-2 py-md-1 small cursor-pointer transition-all d-flex align-items-center justify-content-center"
      style="font-size: 0.75rem; min-height: 32px;" (click)="datePickerClick(day)" [class.available-day]="
          selectedDateEnd() === null &&
          isDayInAllowedRange(day)
        " [class.rented]="isRented(day)" [class.past-day]="isPastDay(day)" [class.selected-day]="isDaySelected(day)">
      {{ day }}
    </div>
    }
  </div>

  <!-- Przycisk resetu -->
  @if (isDatePicker()) {
  <div class="mt-2 text-center">
    <button type="button" class="btn btn-outline-secondary btn-sm rounded-0 w-100 text-uppercase"
      style="font-size: 0.60rem; letter-spacing: 1px;" (click)="datePickerReset()">
      Reset
    </button>
  </div>
  }

  <!-- Mini legenda kolorów -->
  <div class="d-flex flex-wrap justify-content-center gap-3 mt-3 pt-2 border-top text-secondary text-uppercase"
    style="font-size: 0.55rem; letter-spacing: 0.5px;">
    @if(isDatePicker())
    {
    <div class="d-flex align-items-center gap-1">
      <span class="d-inline-block border" style="width: 8px; height: 8px; background-color: yellow;"></span> Dostępny
    </div>
    <div class="d-flex align-items-center gap-1">
      <span class="d-inline-block" style="width: 8px; height: 8px; background-color: green;"></span> Wybrany
    </div>
    }
    <div class="d-flex align-items-center gap-1">
      <span class="d-inline-block" style="width: 8px; height: 8px; background-color: red;"></span> Wynajęty
    </div>
    <div class="d-flex align-items-center gap-1">
      <span class="d-inline-block" style="width: 8px; height: 8px; background-color: grey;"></span> Miniony
    </div>
  </div>

</div>
