<div class="modal fade show d-block" tabindex="-1" style="background-color: rgba(0, 0, 0, 0.5);">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 rounded-0 shadow-lg p-4 p-md-5 bg-white">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title text-uppercase fw-light h4 text-dark" style="letter-spacing: 1px;">
                    Change Password
                </h5>
                <button type="button" class="btn-close shadow-none rounded-0" aria-label="Close"
                    (click)="close.emit()"></button>
            </div>

            <div class="modal-body py-4">
                @if (error()) {
                <app-small-error-view [message]="error()!" />
                }

                <form [formGroup]="changePasswordForm">

                    <div class="mb-3">
                        <label class="form-label text-uppercase text-secondary fw-medium mb-1"
                            style="font-size: 0.65rem; letter-spacing: 1.5px;">
                            New Password
                        </label>

                        <input type="password"
                            class="form-control text-dark shadow-none py-2 px-3 border-0 rounded-0 border-bottom fw-semibold"
                            style="background-color: rgba(0, 0, 0, 0.03); border-color: #adb5bd !important;"
                            formControlName="newPassword" placeholder="••••••••">

                        <app-form-error [control]="changePasswordForm.controls.newPassword">
                        </app-form-error>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-uppercase text-secondary fw-medium mb-1"
                            style="font-size: 0.65rem; letter-spacing: 1.5px;">
                            Confirm New Password
                        </label>

                        <input type="password"
                            class="form-control text-dark shadow-none py-2 px-3 border-0 rounded-0 border-bottom fw-semibold"
                            style="background-color: rgba(0, 0, 0, 0.03); border-color: #adb5bd !important;"
                            formControlName="newPassword1" placeholder="••••••••">

                        <app-form-error [control]="changePasswordForm.controls.newPassword1">
                        </app-form-error>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-uppercase text-secondary fw-medium mb-1"
                            style="font-size: 0.65rem; letter-spacing: 1.5px;">
                            Current Password
                        </label>

                        <input type="password"
                            class="form-control text-dark shadow-none py-2 px-3 border-0 rounded-0 border-bottom fw-semibold"
                            style="background-color: rgba(0, 0, 0, 0.03); border-color: #adb5bd !important;"
                            formControlName="password" placeholder="••••••••">

                        <app-form-error [control]="changePasswordForm.controls.password">
                        </app-form-error>
                    </div>

                    <div class="d-flex gap-2 mt-4">
                        <button type="button"
                            class="btn text-uppercase fw-semibold py-2 px-4 text-white rounded-0 shadow-none flex-grow-1"
                            style="background-color: #1a1a1a; letter-spacing: 0.1em; font-size: 0.70rem;"
                            (click)="saveChangePasswordModal()" [disabled]="changePasswordForm.invalid">
                            Change
                        </button>

                        <button type="button"
                            class="btn text-uppercase fw-semibold py-2 px-4 text-dark bg-transparent border border-dark rounded-0 shadow-none"
                            style="letter-spacing: 0.1em; font-size: 0.70rem;" (click)="close.emit()">
                            Close
                        </button>
                    </div>

                </form>
            </div>

        </div>
    </div>
</div>
