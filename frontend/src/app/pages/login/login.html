<div class="container-fluid d-flex flex-column px-0" style="background-color: #f8f9fa; min-height: calc(100vh - 98px);">

    <div class="row g-0 flex-grow-1">

        <!-- Left Column: LIGHT Login Page -->
        <div class="col-12 col-lg-6 d-flex align-items-center p-4 p-md-5 bg-white">
            <div class="w-100 mx-auto py-4" style="max-width: 500px;">

                <div class="mb-4">
                    <span class="text-uppercase tracking-widest small fw-bold d-block mb-1"
                        style="color: #bfa130;">Login</span>
                    <h2 class="h3 text-dark fw-light">Welcome back</h2>
                </div>

                @if (loginError()) {
                <app-small-error-view [message]="loginError()!" />
                }
<app-portfolio-project-alert-2></app-portfolio-project-alert-2>
                <form [formGroup]="loginForm" (ngSubmit)="login()">

                    <!-- Email -->
                    <div class="mb-3">
                        <label class="form-label text-uppercase small text-secondary" style="font-size: 0.7rem;">
                            Email Address *
                        </label>
                        <input type="email" class="form-control bg-light text-dark shadow-none py-2 px-3 border-0"
                            formControlName="email" placeholder="your@email.com"
                            style="border-bottom: 2px solid #e0e0e0 !important;" />
                        <app-form-error [control]="loginForm.controls.email" />
                    </div>

                    <!-- Password -->
                    <div class="mb-2">
                        <label class="form-label text-uppercase small text-secondary" style="font-size: 0.7rem;">
                            Password *
                        </label>

                        <input type="password" class="form-control bg-light text-dark shadow-none py-2 px-3 border-0"
                            formControlName="password" placeholder="Enter your password"
                            style="border-bottom: 2px solid #e0e0e0 !important;" />

                        <app-form-error [control]="loginForm.controls.password" />
                    </div>

                    <!-- Forgot password -->
                    <div class="text-end mb-4">
                        <a routerLink="/forgot-password" class="small text-decoration-none fw-semibold"
                            style="color: #bfa130;">
                            Forgot your password?
                        </a>
                    </div>

                    <!-- Submit button -->
                    <button type="submit"
                        class="btn w-100 text-uppercase fw-semibold py-3 text-white transition-all mb-3"
                        style="background-color: #1a1a1a; letter-spacing: 0.15em; font-size: 0.8rem;">
                        Log In
                    </button>

                    <!-- Registration link -->
                    <div class="text-center mt-3">
                        <span class="small fw-light text-muted">Don't have an account yet? </span>
                        <a routerLink="/register" class="small text-decoration-none fw-semibold"
                            style="color: #bfa130;">Register</a>
                    </div>

                </form>

            </div>
        </div>

        <!-- Right Column: Atmospheric Image -->
        <div class="col-12 col-lg-6 d-none d-lg-block position-relative p-0">
            <div class="w-100 h-100"
                style="background-image: url('/static_photos/photo_login.jpg'); background-size: cover; background-position: center; filter: brightness(0.85);">
            </div>

            <div class="position-absolute bottom-0 start-0 p-5 text-white w-75"
                style="text-shadow: 0 2px 4px rgba(0,0,0,0.5);">
                <span class="text-uppercase tracking-[0.25em] small fw-semibold d-block mb-2"
                    style="color: #d4af37;">Welcome back to YourWatchRental</span>
                <h2 class="display-5 fw-bold mb-3">Continue Your Journey</h2>
                <p class="lead fw-light text-light">
                    Log in to your dashboard to manage your collection of unique timepieces.
                </p>
            </div>
        </div>

    </div>
</div>
