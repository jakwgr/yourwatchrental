<form [formGroup]="criteriaForm">
    <input type="text" placeholder="city" formControlName="city">
    <input type="text" placeholder="name" formControlName="name" >
    <input type="text" placeholder="address" formControlName="address">
    @if(profile()?.role === "ADMIN")
    {
        <input type="text" placeholder="phone number" formControlName="phoneNumber">
        <input type="text" placeholder="email"  formControlName="email">
        <select  formControlName="status">
            @for ( status of branchOptions; track $index)
            {
                <option [value]="status">{{status}}</option>
            }
        </select>
    }
    <button (click)="save()">szukaj</button>
</form>

@for (branch of branches(); track branch.id)
{
    <app-branches-info-view
    [branch]="branch"
    [role]="profile()?.role"
    (branchUpdated)="reloadBranches()">

    </app-branches-info-view>
}
