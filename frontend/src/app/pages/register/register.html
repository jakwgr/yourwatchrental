<div class="container-fluid d-flex flex-column px-0" style="background-color: #f8f9fa; min-height: calc(100vh - 98px);">

    <div class="row g-0 flex-grow-1">

        <!-- Left Column: Atmospheric Image (remains as a visual accent) -->
        <div class="col-12 col-lg-6 d-none d-lg-block position-relative p-0">
            <div class="w-100 h-100"
                style="background-image: url('/static_photos/photo_register.jpg'); background-size: cover; background-position: center; filter: brightness(0.85);">
            </div>

            <div class="position-absolute bottom-0 start-0 p-5 text-white w-75"
                style="text-shadow: 0 2px 4px rgba(0,0,0,0.5);">
                <span class="text-uppercase tracking-[0.25em] small fw-semibold d-block mb-2"
                    style="color: #d4af37;">Welcome to YourWatchRental</span>
                <h2 class="display-5 fw-bold mb-3">Begin Your Journey</h2>
                <p class="lead fw-light text-light">
                    Join a community of precision watch enthusiasts and gain access to limited-edition timepieces.
                </p>
            </div>
        </div>

        <!-- Right Column: LIGHT Registration Page -->
        <div class="col-12 col-lg-6 d-flex align-items-center p-4 p-md-5 bg-white">
            <div class="w-100 mx-auto py-4" style="max-width: 500px;">

                <div class="mb-4">
                    <span class="text-uppercase tracking-widest small fw-bold d-block mb-1"
                        style="color: #bfa130;">Registration</span>
                    <h2 class="h3 text-dark fw-light">Create a new account</h2>
                </div>

                @if (registerError()) {
                <app-small-error-view [message]="registerError()!" />
                }
<app-portfolio-project-alert-2></app-portfolio-project-alert-2>
                <form [formGroup]="registerForm" (ngSubmit)="register()">

                    <!-- First Name and Last Name -->
                    <div class="row g-3 mb-3">
                        <div class="col-12 col-md-6">
                            <label class="form-label text-uppercase small text-secondary"
                                style="font-size: 0.7rem;">First Name *</label>
                            <input type="text" class="form-control bg-light text-dark shadow-none py-2 px-3 border-0"
                                formControlName="firstName" placeholder="Enter first name"
                                style="border-bottom: 2px solid #e0e0e0 !important;" />
                            <app-form-error
                                [control]="registerForm.controls.firstName">
                            </app-form-error>
                        </div>

                        <div class="col-12 col-md-6">
                            <label class="form-label text-uppercase small text-secondary"
                                style="font-size: 0.7rem;">Last Name *</label>
                            <input type="text" class="form-control bg-light text-dark shadow-none py-2 px-3 border-0"
                                formControlName="lastName" placeholder="Enter last name"
                                style="border-bottom: 2px solid #e0e0e0 !important;" />
                            <app-form-error
                                [control]="registerForm.controls.lastName">
                            </app-form-error>
                        </div>
                    </div>

                    <!-- Date of Birth -->
                    <div class="mb-3">
                        <label class="form-label text-uppercase small text-secondary"
                            style="font-size: 0.7rem;">Date of Birth *</label>
                        <input type="date" class="form-control bg-light text-dark shadow-none py-2 px-3 border-0"
                            formControlName="dateOfBirth"
                            style="border-bottom: 2px solid #e0e0e0 !important;" />
                        <app-form-error
                            [control]="registerForm.controls.dateOfBirth">
                        </app-form-error>
                    </div>

                    <!-- Phone Number -->
                    <div class="mb-3">
                        <label class="form-label text-uppercase small text-secondary"
                            style="font-size: 0.7rem;">Phone Number *</label>
                        <input type="tel" class="form-control bg-light text-dark shadow-none py-2 px-3 border-0"
                            formControlName="phoneNumber" placeholder="e.g. 123456789" maxlength="9"
                            (input)="onlyNumber($event)"
                            style="border-bottom: 2px solid #e0e0e0 !important;" />
                        <app-form-error
                            [control]="registerForm.controls.phoneNumber"
                            patternMessage="Invalid phone number format. Expected format '123456789'"
                        />
                    </div>

                    <!-- Email -->
                    <div class="mb-3">
                        <label class="form-label text-uppercase small text-secondary"
                            style="font-size: 0.7rem;">Email Address *</label>
                        <input type="email" class="form-control bg-light text-dark shadow-none py-2 px-3 border-0"
                            formControlName="email" placeholder="your@email.com"
                            style="border-bottom: 2px solid #e0e0e0 !important;" />
                        <app-form-error
                            [control]="registerForm.controls.email"
                        />
                    </div>

                    <!-- Password -->
                    <div class="mb-4">
                        <label class="form-label text-uppercase small text-secondary"
                            style="font-size: 0.7rem;">Password *</label>
                        <input type="password" class="form-control bg-light text-dark shadow-none py-2 px-3 border-0"
                            formControlName="password" placeholder="Minimum 5 characters"
                            style="border-bottom: 2px solid #e0e0e0 !important;" />
                        <app-form-error
                            [control]="registerForm.controls.password"
                        />
                    </div>

                    <!-- Submit button (dark, elegant contrast on white background) -->
                    <button type="submit"
                        class="btn w-100 text-uppercase fw-semibold py-3 text-white transition-all mb-3"
                        style="background-color: #1a1a1a; letter-spacing: 0.15em; font-size: 0.8rem;">
                        Register
                    </button>

                    <!-- Back to login link -->
                    <div class="text-center mt-3">
                        <span class="small fw-light text-muted">Already have an account? </span>
                        <a routerLink="/login" class="small text-decoration-none fw-semibold"
                            style="color: #bfa130;">Log In</a>
                    </div>

                </form>

            </div>
        </div>

    </div>
</div>
