<div class="container-fluid d-flex flex-column min-vh-100 px-0" style="background-color: #f8f9fa;">

    <div class="row g-0 flex-grow-1">

        <!-- Lewa Kolumna: Klimatyczny obraz (zostaje jako nastrojowy akcent) -->
        <div class="col-12 col-lg-6 d-none d-lg-block position-relative p-0">
            <div class="w-100 h-100"
                style="background-image: url('https://images.unsplash.com/photo-1448375240586-882707db888b?q=80&w=1920&auto=format&fit=crop'); background-size: cover; background-position: center; filter: brightness(0.85);">
            </div>

            <div class="position-absolute bottom-0 start-0 p-5 text-white w-75"
                style="text-shadow: 0 2px 4px rgba(0,0,0,0.5);">
                <span class="text-uppercase tracking-[0.25em] small fw-semibold d-block mb-2"
                    style="color: #d4af37;">Klub Aurelia</span>
                <h2 class="display-5 fw-bold mb-3">Rozpocznij swoją podróż</h2>
                <p class="lead fw-light text-light">Dołącz do grona koneserów mechaniki precyzyjnej i zyskaj dostęp do
                    limitowanych edycji czasomierzy.</p>
            </div>
        </div>

        <!-- Prawa Kolumna: JASNA Strona Rejestracji -->
        <div class="col-12 col-lg-6 d-flex align-items-center p-4 p-md-5 bg-white">
            <div class="w-100 mx-auto py-4" style="max-width: 500px;">

                <div class="mb-4">
                    <span class="text-uppercase tracking-widest small fw-bold d-block mb-1"
                        style="color: #bfa130;">Rejestracja</span>
                    <h2 class="h3 text-dark fw-light">Utwórz nowe konto</h2>
                </div>

                @if (registerError()) {
                <app-small-error-view [message]="registerError()!" />
                }

                <form [formGroup]="registerForm" (ngSubmit)="register()">

                    <!-- Imię i Nazwisko -->
                    <div class="row g-3 mb-3">
                        <div class="col-12 col-md-6">
                            <label class="form-label text-uppercase small text-secondary"
                                style="font-size: 0.7rem;">Imię *</label>
                            <input type="text" class="form-control bg-light text-dark shadow-none py-2 px-3 border-0"
                                formControlName="firstName" placeholder="Wpisz imię"
                                style="border-bottom: 2px solid #e0e0e0 !important;" />
                                                    <app-form-error
                                [control]="registerForm.controls.firstName">
                            </app-form-error>
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label text-uppercase small text-secondary"
                                style="font-size: 0.7rem;">Nazwisko *</label>
                            <input type="text" class="form-control bg-light text-dark shadow-none py-2 px-3 border-0"
                                formControlName="lastName" placeholder="Wpisz nazwisko"
                                style="border-bottom: 2px solid #e0e0e0 !important;" />
                            <app-form-error
                            [control]="registerForm.controls.lastName"> </app-form-error>
                        </div>
                    </div>
                    <!-- Data urodzenia -->
                    <div class="mb-3">
                        <label class="form-label text-uppercase small text-secondary" style="font-size: 0.7rem;">Data
                            urodzenia *</label>
                        <input type="date" class="form-control bg-light text-dark shadow-none py-2 px-3 border-0"
                            formControlName="dateOfBirth" style="border-bottom: 2px solid #e0e0e0 !important;" />
                      <app-form-error
                            [control]="registerForm.controls.dateOfBirth"> </app-form-error>
                    </div>

                    <!-- Numer telefonu -->
                    <div class="mb-3">
                        <label class="form-label text-uppercase small text-secondary" style="font-size: 0.7rem;">Numer
                            telefonu *</label>
                        <input type="tel" class="form-control bg-light text-dark shadow-none py-2 px-3 border-0"
                            formControlName="phoneNumber" placeholder="np. 123456789" maxlength="9" (input)="onlyNumber($event)"
                            style="border-bottom: 2px solid #e0e0e0 !important;" />
                        <app-form-error
                            [control]="registerForm.controls.phoneNumber"
                            patternMessage="Invalid phone number format. Expected format '123456789'"
                        />
                    </div>

                    <!-- Email -->
                    <div class="mb-3">
                        <label class="form-label text-uppercase small text-secondary" style="font-size: 0.7rem;">Adres
                            Email *</label>
                        <input type="email" class="form-control bg-light text-dark shadow-none py-2 px-3 border-0"
                            formControlName="email" placeholder="twoj@email.com"
                            style="border-bottom: 2px solid #e0e0e0 !important;" />
                        <app-form-error
                            [control]="registerForm.controls.email"
                        />
                    </div>

                    <!-- Hasło -->
                    <div class="mb-4">
                        <label class="form-label text-uppercase small text-secondary" style="font-size: 0.7rem;">Hasło
                            *</label>
                        <input type="password" class="form-control bg-light text-dark shadow-none py-2 px-3 border-0"
                            formControlName="password" placeholder="Minimum 5 znaków"
                            style="border-bottom: 2px solid #e0e0e0 !important;" />
                        <app-form-error
                            [control]="registerForm.controls.password"
                        />
                    </div>

                    <!-- Przycisk wysyłania (ciemny, elegancki kontrast na białym tle) -->
                    <button type="submit"
                        class="btn w-100 text-uppercase fw-semibold py-3 text-white transition-all mb-3"
                        style="background-color: #1a1a1a; letter-spacing: 0.15em; font-size: 0.8rem;">
                        Zarejestruj się
                    </button>

                    <!-- Link powrotny do logowania -->
                    <div class="text-center mt-3">
                        <span class="small fw-light text-muted">Masz już konto? </span>
                        <a routerLink="/login" class="small text-decoration-none fw-semibold"
                            style="color: #bfa130;">Zaloguj się</a>
                    </div>

                </form>

            </div>
        </div>

    </div>
</div>
